[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qgate-ai"
version = "0.1.0"
description = "Q-GATE AI — LangGraph-Powered Intelligent Pre-Commit & CI Quality Gate"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Q-GATE AI Team" }
]
keywords = ["quality-gate", "langgraph", "ai", "testing", "ci-cd", "code-review"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer[all]>=0.12.0",
    "rich>=13.0",
    "httpx>=0.27.0",
    "gitpython>=3.1.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "tenacity>=8.0",
    "jinja2>=3.1",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
llm = [
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0",
    "ollama>=0.3.0",
]
security = [
    "bandit>=1.7",
]
all = [
    "qgate-ai[dev,api,llm,security]",
]

[project.scripts]
qgate = "apps.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["apps", "agents", "graphs", "tools", "core", "integrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
